name: Build VisionClaude iOS (unsigned IPA)

on:
  workflow_dispatch: {}
  push:
    paths:
      - "ClaudeVision/ios/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject your own Meta Wearables app credentials
        # Secrets come from: Settings -> Secrets and variables -> Actions
        #   META_APP_ID     = your MetaAppID from wearables.developer.meta.com
        #   META_CLIENT_TOKEN = your ClientToken from the same app
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
        run: |
          PLIST="ClaudeVision/ios/ClaudeVision/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :MWDAT:MetaAppID $META_APP_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :MWDAT:ClientToken $META_CLIENT_TOKEN" "$PLIST"

      - name: Generate Xcode project
        working-directory: ClaudeVision/ios
        run: xcodegen generate

      - name: Build unsigned .app for iphoneos
        working-directory: ClaudeVision/ios
        run: |
          xcodebuild -project ClaudeVision.xcodeproj -scheme ClaudeVision \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package as .ipa (Payload/ layout)
        working-directory: ClaudeVision/ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/ClaudeVision.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ClaudeVision-unsigned.ipa Payload
          mkdir -p ../../dist
          cp ClaudeVision-unsigned.ipa ../../dist/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeVision-unsigned-ipa
          path: dist/ClaudeVision-unsigned.ipa
          retention-days: 30
