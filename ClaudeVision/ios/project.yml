name: ClaudeVision
options:
  bundleIdPrefix: com.claudevision
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    # Pinned exact (not "from:") on purpose: the app code uses the pre-0.7.0
    # StreamSession/StreamSessionConfig/StreamSessionError/StreamSessionState
    # API, which Meta renamed in 0.7.0 and removed entirely in 0.9.0 (replaced
    # by DeviceSession.addCamera(config:)/Camera/Stream). "from: 0.5.0" was
    # resolving to the newest 0.x release and breaking the build. See
    # docs/sdk-0.9-migration.md for the plan to move onto the current API.
    exactVersion: "0.6.0"

targets:
  ClaudeVision:
    type: application
    platform: iOS
    sources:
      - ClaudeVision
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATCamera
    settings:
      base:
        INFOPLIST_FILE: ClaudeVision/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.claudevision.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ClaudeVision:
    build:
      targets:
        ClaudeVision: all
    run:
      config: Debug
